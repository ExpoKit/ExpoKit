name: Close pull requests

# Read-only mirror: close PRs opened from other people's forks so contributors use issues instead.
# PRs from this repo (branches) and from Anshkaran7's fork stay open so Scorecard can see CI and review.
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.user.login != 'Anshkaran7'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for the patch.

          This repo is a read-only mirror — we can't merge PRs here. Please open a **Submit a patch** issue (https://github.com/$REPO/issues/new?template=submit_patch.yml) or paste your diff on the related bug. We'll land it upstream and it'll sync here on the next export."
